<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Diwali Countdown 🪔</title>
<style>
  body { background: #0a0a12; color: #ffd98a; font-family: system-ui; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .card { text-align: center; }
  .diyas { font-size: 3rem; animation: flicker 1.5s infinite alternate; }
  @keyframes flicker { from { opacity: .7; } to { opacity: 1; } }
  #timer { display: flex; gap: 16px; justify-content: center; margin-top: 16px; }
  .box { background: #1a1a2e; padding: 16px; border-radius: 12px; min-width: 70px; }
  .box span { font-size: 2rem; display: block; }
  .whisper { opacity: 0; transition: opacity 1s; font-style: italic; margin-top: 12px; }
  .whisper.show { opacity: 1; }
</style>
</head>
<body>
<div class="card">
  <div class="diyas">🪔 🪔 🪔</div>
  <h1>Diwali is coming...</h1>
  <div id="timer">
    <div class="box"><span id="d">0</span>Days</div>
    <div class="box"><span id="h">0</span>Hours</div>
    <div class="box"><span id="m">0</span>Mins</div>
    <div class="box"><span id="s">0</span>Secs</div>
  </div>
  <div id="whisper" class="whisper">Techno services wishes to All... ✨</div>
</div>

<script>
  // Diwali 2026 - Nov 8, 00:00 local time
  const diwaliDate = new Date('2026-11-08T00:00:00');

  const dEl = document.getElementById('d');
  const hEl = document.getElementById('h');
  const mEl = document.getElementById('m');
  const sEl = document.getElementById('s');
  const whisper = document.getElementById('whisper');

  function updateCountdown() {
    const now = new Date();
    const diff = diwaliDate - now;

    if (diff <= 0) {
      document.querySelector('h1').textContent = 'Happy Diwali! 🪔✨';
      whisper.textContent = 'All the Best wishes by Techno Services ';
      whisper.classList.add('show');
      clearInterval(timer);
      return;
    }

    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor(diff / (1000*60*60) % 24);
    const m = Math.floor(diff / (1000*60) % 60);
    const s = Math.floor(diff / 1000 % 60);

    dEl.textContent = d;
    hEl.textContent = h;
    mEl.textContent = m;
    sEl.textContent = s;

    // whisper effect: softly fade in/out every 5 seconds
    if (s % 5 === 0) {
      whisper.classList.remove('show');
      setTimeout(() => whisper.classList.add('show'), 300);
    }
  }

  const timer = setInterval(updateCountdown, 1000);
  updateCountdown();
</script>
</body>
</html>
